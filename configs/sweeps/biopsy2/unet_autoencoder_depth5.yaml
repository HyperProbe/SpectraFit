name: unet_autoencoder_depth5_lr_activation_sweep
method: random
parameters:
  autoencoder_type:
    value: Unet
  in_channels:
    value: 10
  optimizer:
    value: Adam
  kernel_size:
    value: 3
  padding:
    value: 1
  base_channels:
    value: 64
  batch_size:
    value: 4
  save_checkpoints:
    value: False
  unet_depth:
    value: 5
  device:
    value: cuda:0
  learning_rate:
    min: 0.001
    max: 0.01
  activation:
    values:
      - ReLU
      - LeakyReLU
      - ELU
  num_epochs:
    value: 20
  early_stopping_patience:
    value: 8
  loss_function:
    value: weighted
  loss_weights:
    parameters:
      alpha:
        value: 0.5
metric:
  name: test/mse
  goal: minimize
