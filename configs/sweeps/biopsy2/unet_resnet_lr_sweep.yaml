name: unet_resnet_lr_sweep
method: random
parameters:
  autoencoder_type:
    value: Unet
  encoder_name:
    values: 
      - resnet18
      - resnet34
      - resnet50
      - resnet101
      - resnet152
  in_channels:
    value: 10
  optimizer:
    value: Adam
  kernel_size:
    value: 3
  batch_size:
    value: 4
  save_checkpoints:
    value: False
  device:
    value: cuda:0
  learning_rate:
    min: 0.001
    max: 0.01
  num_epochs:
    value: 20
  early_stopping_patience:
    value: 8
  loss_function:
    value: weighted
  loss_weights:
    parameters:
      alpha:
        value: 0.5
metric:
  name: test/mse
  goal: minimize
