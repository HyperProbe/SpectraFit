name: unet_linknet_efficientnet_lr_sweep
method: random
parameters:
  autoencoder_type:
    values: 
      - Unet
      - Linknet
  encoder_name:
    values: 
      - efficientnet-b0
      - efficientnet-b1
      - efficientnet-b2
      - efficientnet-b3
      - efficientnet-b4
      - efficientnet-b5
      - efficientnet-b6
      - efficientnet-b7
  in_channels:
    value: 10
  optimizer:
    value: Adam
  kernel_size:
    value: 3
  batch_size:
    value: 4
  save_checkpoints:
    value: False
  device:
    value: cuda:0
  learning_rate:
    min: 0.001
    max: 0.01
  num_epochs:
    value: 20
  early_stopping_patience:
    value: 8
  loss_function:
    value: weighted
  loss_weights:
    parameters:
      alpha:
        min: 0.1
        max: 0.9
metric:
  name: test/mse
  goal: minimize
