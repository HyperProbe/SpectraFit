name: autoencoder_baseline_patched
method: random
parameters:
  autoencoder_type:
    value: MonaiAutoencoder
  in_channels:
    value: 3
  optimizer:
    value: Adam
  kernel_size:
    value: 3
  image_wise_normalization:
    value: True
  merge_channels_to_signals:
    value: ['HbT', 'diffCCO', 'b']
  stride:
    values: 
      - [1,2,2,2,2]
      - [2,2,2,2,2]
      - [2,2,2,2,1]
  num_res_units:
    values:
      - 0
      - 1
      - 2
  encoder_channels:
    values: 
      - [256, 512, 1024, 2048,4096]
      - [128, 256, 512, 1024,2048]
      - [256,512,1024, 2048, 2048]
  dropout:
    values:
      - 0.0
      - 0.025
      - 0.05
      - 0.075
      - 0.1
  batch_size:
    values: 
      - 2
      - 3
  save_checkpoints:
    value: False
  test_ids:
    value: ['008-01', '008-02', '012-01', '012-02', '015-01', '016-01','016-02','016-03','016-04', '016-05', '020-01', '025-02']
  validation_ids:
    value: ['013-01', '014-01', '022-02', '027-02'] 
  device:
    value: cuda:0
  learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  activation:
    value: PReLU
  num_epochs:
    value: 150
  early_stopping_patience:
    value: 50
  log_image_epoch:
    value: 10
  loss_function:
    value: MSE
  center_crop_size:
    value: [192, 192]  # Example crop size, adjust as needed
  log_coarseness:
    value: 1 
  sample_type:
    value: helicoid  # helicoid, biopsy2
  project:
    value: helicoid-autoencoder  # Project name for logging
  reduced_wl_dir:
    value: /home/macht/thesis/hsi-biopsy/results/helicoid_spectral_unmixing/coarseness_1_left_530_right_750_reduced
  gt_dir:
    value: /home/macht/thesis/hsi-biopsy/results/helicoid_spectral_unmixing/coarseness_1_left_530_right_750
  normalization_dir:
    value: /home/macht/thesis/hsi-biopsy/results/statistics/helicoid  # Directory for normalization statistics
metric:
  name: test/mse
  goal: minimize
