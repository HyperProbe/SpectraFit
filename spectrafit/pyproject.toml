[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrafit"
version = "0.1.4"
description = "Spectral unmixing of hyperspectral images (modified Beer–Lambert law) with a napari interface"
readme = { text = "Spectral unmixing of hyperspectral images with a napari interface. User guide: README.html, or https://github.com/HyperProbe/SpectraFit/blob/main/spectrafit/README.md", content-type = "text/plain" }
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "HyperProbe / SpectraFit contributors" }]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "h5py>=3.6",
    "pyyaml>=6",
    "matplotlib>=3.5",
    "tifffile>=2022.5.4",
]

[project.optional-dependencies]
gui = ["napari[qt]>=0.5", "qtpy"]
test = ["pytest>=7", "markdown>=3.4"]

[project.scripts]
spectrafit = "spectrafit.cli:main"

[project.entry-points."napari.manifest"]
spectrafit = "spectrafit.napari_plugin:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spectrafit = ["data/*.yaml", "data/chromophores/*.csv", "data/pathlengths/*.csv", "napari_plugin/napari.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
